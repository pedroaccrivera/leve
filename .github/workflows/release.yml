name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
            eb_platform: --mac
            artifact: leve-mac-arm64

          - os: windows-latest
            arch: x64
            eb_platform: --win
            artifact: leve-win-x64

    runs-on: ${{ matrix.os }}
    name: Build · ${{ matrix.artifact }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm_config_arch ensures npm installs the correct Sharp/ffmpeg prebuilt
      # binaries for the target arch.
      - name: Install dependencies
        run: npm ci
        env:
          npm_config_arch: ${{ matrix.arch }}

      - name: Build frontend (TypeScript + Vite)
        shell: bash
        run: npx tsc && npx vite build

      # NOTE: GH_TOKEN is deliberately NOT passed here. electron-builder would
      # otherwise auto-publish artifacts to its own draft release, racing with
      # the "Upload to GitHub Release" step below (duplicate drafts + asset
      # deletes — this silently dropped the mac .zip in v1.2.1). The action
      # below is the single uploader; it gets GH_TOKEN via softprops default.
      - name: Package with electron-builder
        shell: bash
        run: npx electron-builder ${{ matrix.eb_platform }} --${{ matrix.arch }}
        env:
          # Disable automatic code-signing discovery on macOS (no cert configured).
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Upload distributable files (.dmg, .zip, .exe) to the GitHub Release
      # created by the tag push. Parallel matrix jobs all upload to the same release.
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
