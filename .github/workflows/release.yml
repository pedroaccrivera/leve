name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
            eb_platform: --mac
            artifact: leve-darwin-arm64

          - os: macos-26-intel
            arch: x64
            eb_platform: --mac
            artifact: leve-darwin-x64

          - os: windows-latest
            arch: x64
            eb_platform: --win
            artifact: leve-win32-x64

          - os: windows-11-arm
            arch: arm64
            eb_platform: --win
            artifact: leve-win32-arm64

    runs-on: ${{ matrix.os }}
    name: Build · ${{ matrix.artifact }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm_config_arch ensures npm installs the correct Sharp prebuilt binary
      # for the target arch (critical for the Windows arm64 cross-compilation job,
      # which runs on a Windows x64 runner).
      - name: Install dependencies
        run: npm ci
        env:
          npm_config_arch: ${{ matrix.arch }}

      - name: Build frontend (TypeScript + Vite)
        shell: bash
        run: npx tsc && npx vite build

      - name: Package with electron-builder
        shell: bash
        run: npx electron-builder ${{ matrix.eb_platform }} --${{ matrix.arch }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Disable automatic code-signing discovery on macOS (no cert configured).
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Upload distributable files (.dmg, .zip, .exe) to the GitHub Release
      # created by the tag push. Parallel matrix jobs all upload to the same release.
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
