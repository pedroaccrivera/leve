name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
            eb_platform: --mac
            artifact: leve-mac-arm64

          - os: windows-latest
            arch: x64
            eb_platform: --win
            artifact: leve-win-x64

    runs-on: ${{ matrix.os }}
    name: Build · ${{ matrix.artifact }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm_config_arch ensures npm installs the correct Sharp/ffmpeg prebuilt
      # binaries for the target arch.
      - name: Install dependencies
        run: npm ci
        env:
          npm_config_arch: ${{ matrix.arch }}

      - name: Build frontend (TypeScript + Vite)
        shell: bash
        run: npx tsc && npx vite build

      # NOTE: electron-builder must NOT publish. `--publish never` keeps it
      # responsible only for packaging: without it, the builder detects the
      # tag/repo and demands GH_TOKEN / auto-publishes to its own draft,
      # racing with the upload step below (this silently dropped the mac .zip
      # in v1.2.1). The "Upload to GitHub Release" step is the sole publisher.
      - name: Package with electron-builder
        shell: bash
        run: npx electron-builder ${{ matrix.eb_platform }} --${{ matrix.arch }} --publish never
        env:
          # Disable automatic code-signing discovery on macOS (no cert configured).
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Upload distributable files (.dmg, .zip, .exe) to the GitHub Release
      # created by the tag push. Parallel matrix jobs all upload to the same release.
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          generate_release_notes: true
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
